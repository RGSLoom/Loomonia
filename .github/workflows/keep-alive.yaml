# Haelt das Supabase-Projekt wach: Free-Projekte werden nach etwa einer Woche
# ohne Aktivitaet pausiert. Die Abfrage liest eine Zeile aus der oeffentlich
# lesbaren Tabelle locations und zaehlt als Datenbank-Aktivitaet. Der Key ist
# der oeffentliche publishable Key, der ohnehin in js/supabase-config.js steht.
name: Supabase Keep-Alive

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: locations abfragen
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            "https://oztsymfskxaeonxqggfb.supabase.co/rest/v1/locations?select=id&limit=1" \
            -H "apikey: sb_publishable_eLpKDhCusR_w3Fc6eh_0Lw_k8aiE-oO" \
            -H "Authorization: Bearer sb_publishable_eLpKDhCusR_w3Fc6eh_0Lw_k8aiE-oO"
          echo
